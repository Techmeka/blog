# Metadata for whitepapers listed at /blog/whitepapers/.
#
# The listing auto-scans docs/whitepapers/*.html and matches each file to
# an entry here by slug (the filename minus .html). Add an entry to
# publish and control ordering.
#
# Required per entry:
#   slug   — matches the HTML filename (secure-html-sharing → secure-html-sharing.html)
#   title  — headline for the card
#   date   — publication date (sorts listings, shown on the card).
#            Add it in the article itself too if you want it visible there.
#
# Optional:
#   type   — pill badge (see suggested values below). Defaults to "Whitepaper".
#   subtitle, description, tags, thumbnail, featured, reading_time
#
# `type` renders as a pill on the card. Suggested values:
#   Whitepaper     - traditional analytical piece, vendor-neutral posture
#   Perspective    - opinionated point of view; thought leadership
#   Field Guide    - hands-on, interactive, scenario-heavy
#   Category Brief - argues for a new category / positions vs incumbent
#   Case Study     - real customer implementation and outcome
#   Report         - data-forward research
# Omit `type` to fall back to "Whitepaper".

- slug: "secure-html-sharing"
  type: "Field Guide"
  title: "Secure HTML Document Sharing"
  subtitle: "A link-based, browser-native alternative to file-label DRM."
  date: 2026-08-06
  description: >-
    Modern AI produces its highest-fidelity output in HTML. The tools your
    organization already uses (AIP, Purview DLP) were built for a different
    world. This is what a protection layer designed for AI-native content
    looks like — with concrete examples, threat model, and a head-to-head
    against the incumbent stack.
  thumbnail: /blog/images/optimized/logoTechMekaBlack.png
  tags: [ai, security, dlp, sales-enablement]
  featured: true
  reading_time: "12 min"
